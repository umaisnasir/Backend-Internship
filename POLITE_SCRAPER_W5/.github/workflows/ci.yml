name: Polite Scraper CI

on:
  push:
    paths:
      - "POLITE_SCRAPER_W5/**"
      - ".github/workflows/polite-scraper-ci.yml"

  pull_request:
    paths:
      - "POLITE_SCRAPER_W5/**"
      - ".github/workflows/polite-scraper-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: POLITE_SCRAPER_W5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: POLITE_SCRAPER_W5/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python files
        run: python -m compileall app tests